name: fedora-lifecycle-diagnostics
on:
  push:
    branches: [feature/distro-onboarding]
permissions:
  contents: read
  actions: read
jobs:
  fedora-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '44'
            image: docker.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - release: rawhide
            image: docker.io/library/fedora:rawhide@sha256:a9bab18d01cf2c2cf62f3e79c72623405bce14ac062995cc6651a3073c802e41
    env:
      TOPO_FEDORA_IMAGE: ${{ matrix.image }}
      TOPO_SETUP_DISPOSABLE_CI: 'yes'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Verify only lifecycle harness differs from qualified RPM source
        run: |
          git diff --name-only db47651e421cd2f77ac9dbd2a252c5f86bcbde82 HEAD > "$RUNNER_TEMP/changes"
          while IFS= read -r path; do
            case "$path" in
              scripts/test-worker-setup-systemd.py|packaging/distro/test-fedora-systemd.sh|.github/workflows/fedora-lifecycle-diagnostics.yml) ;;
              *) echo "Product or packaging source changed; new native build required"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changes"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: fedora-review-${{ matrix.release }}-ubuntu-24.04
          run-id: 38939478289
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fedora-review
      - name: Diagnose actual qualified RPM lifecycle
        run: bash packaging/distro/test-fedora-systemd.sh "$RUNNER_TEMP/fedora-review"
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fedora-diagnostics-${{ matrix.release }}
          path: ${{ runner.temp }}/topo-fedora-systemd.*/*.log
          retention-days: 2
