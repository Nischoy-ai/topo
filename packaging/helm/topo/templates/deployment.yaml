{{- $secretName := required "apiKeySecret.name is required; create the Secret outside Helm" .Values.apiKeySecret.name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "topo.fullname" . }}
  labels:
    {{- include "topo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "topo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "topo.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "topo.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: topo
          image: {{ include "topo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -addr=:8080
            - -api-key-ref=file:/run/secrets/topo/api-key
            {{- if .Values.persistence.enabled }}
            - -db-driver=sqlite
            - -db-dsn=/var/lib/topo/topo.db
            {{- else }}
            - -db-driver=memory
            {{- end }}
            {{- if .Values.sourcePrecedence }}
            - {{ printf "-source-precedence=%s" (join "," .Values.sourcePrecedence) | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: api-key
              mountPath: /run/secrets/topo
              readOnly: true
            - name: data
              mountPath: /var/lib/topo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: api-key
          secret:
            secretName: {{ $secretName }}
            items:
              - key: {{ .Values.apiKeySecret.key }}
                path: api-key
                mode: 0440
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "topo.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
