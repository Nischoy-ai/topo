# Preparation input only. No dependency overrides or license exclusions.
# Full-CLI review inputs; every license file is checked with pinned manual composites.
[licensing]
detector = "askalono"

[archive]
use_module_proxy = true
tidy = true
# Preserve additional source/header and artwork attribution in the vendor archive.
post_commands = [
    ["cp", "packaging/distro/licenses/COPYRIGHT-MUSL-THIRD-PARTY", "vendor/modernc.org/libc/COPYRIGHT-MUSL-THIRD-PARTY"],
    ["cp", "packaging/distro/licenses/LICENSE-Linux-man-pages-copyleft", "vendor/modernc.org/libc/LICENSE-Linux-man-pages-copyleft"],
    ["cp", "packaging/distro/licenses/LICENSE-SunPro", "vendor/modernc.org/libc/LICENSE-SunPro"],
    ["cp", "packaging/distro/licenses/LICENSE-bcrypt-Solar-Designer", "vendor/modernc.org/libc/LICENSE-bcrypt-Solar-Designer"],
    ["cp", "packaging/distro/licenses/LICENSE-CC-BY-2.5", "vendor/modernc.org/memory/LICENSE-CC-BY-2.5"],
    ["cp", "packaging/distro/licenses/LICENSE-CC0-1.0", "vendor/modernc.org/memory/LICENSE-CC0-1.0"],
    ["cp", "packaging/distro/licenses/NOTICE-MEMORY-LOGO", "vendor/modernc.org/memory/NOTICE-MEMORY-LOGO"],
]

# Manually inspected composite license texts; pin hashes so upstream changes
# require a fresh review. No license files or directories are excluded.
# See fedora-license-review.md for rationale and dated classification history.

